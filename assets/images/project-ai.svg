<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8F8FC"/>
      <stop offset="100%" stop-color="#E7E7EF"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3D3A8C"/>
      <stop offset="100%" stop-color="#7C6FE0"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="url(#bg)"/>
  <!-- UI Card -->
  <rect x="60" y="40" width="520" height="320" rx="16" fill="white" stroke="#E7E7EF" stroke-width="2"/>
  <!-- Top Bar -->
  <rect x="60" y="40" width="520" height="40" rx="16" fill="#3D3A8C"/>
  <rect x="60" y="64" width="520" height="16" fill="#3D3A8C"/>
  <circle cx="90" cy="60" r="5" fill="#EF4444"/>
  <circle cx="106" cy="60" r="5" fill="#FBBF24"/>
  <circle cx="122" cy="60" r="5" fill="#22C55E"/>
  <!-- AI Visual Charts -->
  <rect x="90" y="110" width="210" height="110" rx="10" fill="url(#accent)" opacity="0.1"/>
  <polyline points="100,190 140,150 170,170 210,130 250,150 280,120" stroke="url(#accent)" stroke-width="3" fill="none" stroke-linecap="round"/>
  <circle cx="280" cy="120" r="5" fill="#7C6FE0"/>
  <!-- Right Nodes -->
  <rect x="330" y="110" width="220" height="110" rx="10" fill="#FAFAFF" stroke="#E7E7EF"/>
  <circle cx="380" cy="165" r="20" fill="#3D3A8C" opacity="0.1"/>
  <circle cx="440" cy="165" r="20" fill="#5B4FCF" opacity="0.2"/>
  <circle cx="500" cy="165" r="20" fill="#7C6FE0" opacity="0.3"/>
  <!-- Bottom Rows -->
  <rect x="90" y="245" width="460" height="16" rx="8" fill="#F3F3FA"/>
  <rect x="90" y="275" width="340" height="16" rx="8" fill="#F3F3FA"/>
  <text x="320" y="325" text-anchor="middle" font-family="Poppins, sans-serif" font-size="16" font-weight="700" fill="#3D3A8C">Predictive Analytics Platform</text>
</svg>
